# ============================================================
# Prometheus Configuration
# Scrapes metrics from local services
# ============================================================

global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    cluster: 'eth-phishing-local'

alerting:
  alertmanagers: []

rule_files: []

scrape_configs:
  # ── API Service Metrics ──
  - job_name: 'api'
    static_configs:
      - targets: ['api:8000']
    metrics_path: '/metrics'
    scrape_interval: 5s

  # ── Prometheus Self-Monitoring ──
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  # ── Kafka Metrics (optional) ──
  # Requires Kafka Exporter
  # - job_name: 'kafka'
  #   static_configs:
  #     - targets: ['kafka-exporter:9308']

  # ── MLflow Metrics (optional) ──
  # - job_name: 'mlflow'
  #   static_configs:
  #     - targets: ['mlflow:5000']
  #   metrics_path: '/metrics'
